<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murilo Miguel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #04060f;
      --surface:   rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --cyan:      #00e5ff;
      --amber:     #ffb340;
      --text:      #e8eaf0;
      --muted:     #7a8099;
      --glow-c:    0 0 18px rgba(0,229,255,0.45);
      --glow-a:    0 0 18px rgba(255,179,64,0.45);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      overflow-x: hidden;
    }

    /* ─── CANVAS BG ─────────────────────────────── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── LAYOUT ─────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 80px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── AVATAR ─────────────────────────────────── */
    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      animation: float 4s ease-in-out infinite;
    }
    .avatar-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: conic-gradient(var(--cyan), var(--amber), var(--cyan)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin 6s linear infinite;
    }
    .avatar-inner {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a2a4a 0%, #0d1525 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      overflow: hidden;
    }
    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* ─── PROFILE TEXT ───────────────────────────── */
    .name {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(1.4rem, 6vw, 1.8rem);
      letter-spacing: 0.04em;
      text-align: center;
      background: linear-gradient(90deg, var(--cyan) 0%, #fff 50%, var(--amber) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: fadeUp 0.6s ease both;
    }
    .tagline {
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp 0.7s ease both;
    }
    .tagline span {
      color: var(--cyan);
    }

    /* ─── VOTE BANNER ────────────────────────────── */
    .vote-banner {
      width: 100%;
      margin-bottom: 28px;
      animation: fadeUp 0.75s ease both;
    }
    .vote-banner a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,179,64,0.15) 0%, rgba(255,100,30,0.1) 100%);
      border: 1px solid rgba(255,179,64,0.35);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 0 rgba(255,179,64,0);
    }
    .vote-banner a:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow-a);
    }
    .vote-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    .vote-text strong {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--amber);
    }
    .vote-text span {
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* ─── SECTION LABEL ──────────────────────────── */
    .section-label {
      align-self: flex-start;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    /* ─── LINKS ──────────────────────────────────── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: transform 0.18s, background 0.18s, border-color 0.18s, box-shadow 0.18s;
      backdrop-filter: blur(6px);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }
    .link-btn:hover {
      transform: translateX(5px);
      background: rgba(255,255,255,0.07);
    }

    .link-btn .ico {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    .link-btn .arrow {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.8rem;
      transition: transform 0.18s, color 0.18s;
    }
    .link-btn:hover .arrow {
      transform: translateX(3px);
      color: var(--text);
    }

    /* Platform colors */
    .yt   { --c: #ff4444; }
    .ig   { --c: #e1306c; }
    .tt   { --c: #00f2ea; }
    .fb   { --c: #1877f2; }
    .itch { --c: #fa5c5c; }

    .yt   .ico { background: rgba(255,68,68,0.15);   border: 1px solid rgba(255,68,68,0.25); }
    .ig   .ico { background: rgba(225,48,108,0.15);  border: 1px solid rgba(225,48,108,0.25); }
    .tt   .ico { background: rgba(0,242,234,0.12);   border: 1px solid rgba(0,242,234,0.25); }
    .fb   .ico { background: rgba(24,119,242,0.15);  border: 1px solid rgba(24,119,242,0.25); }
    .itch .ico { background: rgba(250,92,92,0.15);   border: 1px solid rgba(250,92,92,0.25); }

    .yt:hover   { border-color: rgba(255,68,68,0.4);  box-shadow: 0 0 16px rgba(255,68,68,0.2); }
    .ig:hover   { border-color: rgba(225,48,108,0.4); box-shadow: 0 0 16px rgba(225,48,108,0.2); }
    .tt:hover   { border-color: rgba(0,242,234,0.4);  box-shadow: 0 0 16px rgba(0,242,234,0.2); }
    .fb:hover   { border-color: rgba(24,119,242,0.4); box-shadow: 0 0 16px rgba(24,119,242,0.2); }
    .itch:hover { border-color: rgba(250,92,92,0.4);  box-shadow: 0 0 16px rgba(250,92,92,0.2); }

    /* stagger */
    .link-btn:nth-child(1) { animation-delay: 0.1s; }
    .link-btn:nth-child(2) { animation-delay: 0.18s; }
    .link-btn:nth-child(3) { animation-delay: 0.26s; }
    .link-btn:nth-child(4) { animation-delay: 0.34s; }
    .link-btn:nth-child(5) { animation-delay: 0.42s; }

    /* ─── FOOTER ─────────────────────────────────── */
    .footer {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-top: auto;
      padding-top: 40px;
    }
    .footer span { color: var(--cyan); }

    /* ─── KEYFRAMES ──────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }
  </style>
</head>
<body>

<script>
  /* ── Particle field ── */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, pts = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function init() {
    resize();
    pts = Array.from({ length: 90 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.22,
      hue: Math.random() < 0.5 ? 185 : 38,   // cyan or amber
      a: Math.random() * 0.5 + 0.2
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    /* soft nebula gradient */
    const g = ctx.createRadialGradient(W*.5, H*.4, 0, W*.5, H*.4, W*.65);
    g.addColorStop(0,   'rgba(0,60,100,0.18)');
    g.addColorStop(0.5, 'rgba(0,20,50,0.08)');
    g.addColorStop(1,   'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    pts.forEach(p => {
      /* move */
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;

      /* draw */
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},100%,70%,${p.a})`;
      ctx.fill();
    });

    /* draw connections */
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 90) {
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = `rgba(0,229,255,${0.06 * (1 - d/90)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  draw();
</script>
